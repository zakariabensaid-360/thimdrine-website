<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="400">
  <rect width="500" height="500" fill="#fcf9f2"/>
  <g transform="translate(250,250) scale(1.15)">
    <!-- Outer Octagram (Khatim / Moroccan Star) Outer Outline -->
    <path d="M 0,-160 L 40,-120 L 113,-113 L 120,-40 L 160,0 L 120,40 L 113,113 L 40,120 L 0,160 L -40,120 L -113,113 L -120,40 L -160,0 L -120,-40 L -113,-113 L -40,-120 Z" 
          fill="none" stroke="#a3583d" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Primary Square 1 (Rotated 0deg) -->
    <rect x="-105" y="-105" width="210" height="210" fill="none" stroke="#8c472f" stroke-width="5" />
    
    <!-- Primary Square 2 (Rotated 45deg) -->
    <rect x="-105" y="-105" width="210" height="210" fill="none" stroke="#8c472f" stroke-width="5" transform="rotate(45)" />

    <!-- Outer Petals / Diamond Accents (Terracotta) -->
    <g fill="#ba5d3d" stroke="#8c472f" stroke-width="2">
      <!-- 8 Outer Points -->
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(45)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(90)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(135)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(180)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(225)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(270)" />
      <path d="M 0,-160 L 25,-125 L 0,-105 L -25,-125 Z" transform="rotate(315)" />
    </g>

    <!-- Inner Geometric Star Network (Warm Amber & Earthy Tone accents) -->
    <g fill="#d9a05b" stroke="#8c472f" stroke-width="2">
      <!-- Inner Corner Triangles -->
      <polygon points="0,-105 30,-75 -30,-75" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(45)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(90)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(135)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(180)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(225)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(270)" />
      <polygon points="0,-105 30,-75 -30,-75" transform="rotate(315)" />
    </g>

    <!-- Mid-layer Octagram Star Ring -->
    <path d="M 0,-75 L 22,-52 L 53,-53 L 53,-22 L 75,0 L 53,22 L 53,53 L 22,53 L 0,75 L -22,53 L -53,53 L -53,22 L -75,0 L -53,-22 L -53,-53 L -22,-53 Z" 
          fill="#faf4e8" stroke="#8c472f" stroke-width="4"/>

    <!-- Central Olive Leaf / Wheat Sprout Iconography -->
    <g fill="#707845" stroke="#4a5229" stroke-width="1.5">
      <!-- Center Stem -->
      <line x1="0" y1="35" x2="0" y2="-35" stroke="#4a5229" stroke-width="3"/>
      
      <!-- Central Leaves -->
      <path d="M 0,-35 C 15,-20 20,-5 0,10 C -20,-5 -15,-20 0,-35 Z" fill="#889255"/>
      <path d="M 0,-15 C 22,0 25,18 0,30 C -25,18 -22,0 0,-15 Z" fill="#707845"/>
      
      <!-- Branching Sprigs -->
      <path d="M 0,0 C 15,-12 25,-8 28,2 C 18,3 8,-2 0,0 Z"/>
      <path d="M 0,0 C -15,-12 -25,-8 -28,2 C -18,3 -8,-2 0,0 Z"/>
      <path d="M 0,15 C 12,5 20,8 22,18 C 14,18 6,14 0,15 Z"/>
      <path d="M 0,15 C -12,5 -20,8 -22,18 C -14,18 -6,14 0,15 Z"/>
    </g>

    <!-- Central Golden Core Dot -->
    <circle cx="0" cy="0" r="6" fill="#d9a05b" stroke="#4a5229" stroke-width="1.5"/>
  </g>
</svg>
